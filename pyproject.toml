[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alterego-data-profiler"
version = "0.1.0"
description = "Dataset profiling package for the AlterEgo ecosystem — detects formats, encodings, types, domains, stats, PII, and generates data dictionaries."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Kmilo Aparicio" },
]

dependencies = [
    "polars>=1.0.0",
    "pydantic>=2.0.0",
    "charset-normalizer>=3.0.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1.0",
    "filetype>=1.2.0",
]

[project.scripts]
alterego-profiler = "alterego_data_profiler.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alterego_data_profiler"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
